<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#15130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To Do List">

<title>To Do List · JGK Fernández</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2315130F'/%3E%3Cpath d='M28 52l14 14 30-34' stroke='%23E8A33D' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2315130F'/%3E%3Cpath d='M28 52l14 14 30-34' stroke='%23E8A33D' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#15130F; --bg2:#1C1913; --card:#221E17; --card2:#2A251C;
  --line:#38321F; --line2:#463D26;
  --ink:#F3EDE0; --ink2:#B8AE97; --ink3:#7C7358;
  --amber:#E8A33D; --amber-d:#3A2A12;
  --teal:#4FB0A5; --teal-d:#12312D;
  --red:#E2634F; --red-d:#3A1B15;
  --radius:16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; padding-bottom:calc(84px + var(--safe-b)); overscroll-behavior-y:none;}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; margin:0;}
::selection{background:var(--amber); color:#15130F;}

/* Header */
header.top{position:sticky; top:0; z-index:30; background:rgba(21,19,15,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding:14px 18px calc(12px + env(safe-area-inset-top,0px)); padding-top:calc(14px + env(safe-area-inset-top,0px));}
.brandrow{display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--amber),#c97e1f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:15px;}
.brand .txt{font-weight:700; font-size:16px; letter-spacing:-.2px;}
.brand .txt small{display:block; font-weight:500; font-size:11px; color:var(--ink3); letter-spacing:.3px;}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:16px;}

/* Section subnav (pills) */
.pillnav{display:flex; gap:8px; padding:12px 16px 4px; overflow-x:auto; scrollbar-width:none;}
.pillnav::-webkit-scrollbar{display:none;}
.pill{flex:none; padding:9px 15px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--ink2); font-size:13.5px; font-weight:600; white-space:nowrap;}
.pill.active{background:var(--amber); border-color:var(--amber); color:#1a1206;}
.pill .cnt{opacity:.65; font-weight:700; margin-left:4px;}

main{padding:14px 16px 24px;}
.view{display:none;}
.view.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* Cards */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.card.tap{cursor:pointer;}
.rowtop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.evname{font-weight:700; font-size:15.5px;}
.evmeta{color:var(--ink3); font-size:12.5px; margin-top:2px;}
.badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; letter-spacing:.2px;}
.badge.pend{background:var(--amber-d); color:var(--amber);}
.badge.ok{background:var(--teal-d); color:var(--teal);}
.badge.warn{background:var(--red-d); color:var(--red);}
.progwrap{height:5px; border-radius:99px; background:var(--line); margin-top:12px; overflow:hidden;}
.progbar{height:100%; background:var(--amber); border-radius:99px; transition:width .25s;}

.emptystate{text-align:center; padding:48px 20px; color:var(--ink3);}
.emptystate .big{font-size:34px; margin-bottom:10px;}
.emptystate p{font-size:13.5px; line-height:1.5; max-width:280px; margin:6px auto 0;}

/* FAB */
.fab{position:fixed; right:18px; bottom:calc(90px + var(--safe-b)); width:54px; height:54px; border-radius:17px; background:var(--amber); color:#1a1206; border:none; font-size:26px; font-weight:400; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px -6px rgba(232,163,61,.55); z-index:25;}

/* Bottom tab bar */
nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(21,19,15,.94); backdrop-filter:blur(16px); border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + var(--safe-b));}
nav.tabbar button{flex:1; background:none; border:none; color:var(--ink3); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; padding:6px 0;}
nav.tabbar button .ic{font-size:19px;}
nav.tabbar button.active{color:var(--amber);}

/* Sheet (modal) */
.sheetbg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:none; align-items:flex-end;}
.sheetbg.show{display:flex;}
.sheet{background:var(--bg2); width:100%; max-height:88vh; border-radius:22px 22px 0 0; overflow-y:auto; padding:10px 18px calc(24px + var(--safe-b)); animation:up .22s ease;}
@keyframes up{from{transform:translateY(24px); opacity:.4;} to{transform:none; opacity:1;}}
.sheet .grabber{width:36px;height:4px;background:var(--line2);border-radius:99px;margin:8px auto 14px;}
.sheet h2{font-size:18px; margin-bottom:14px;}
label.f{display:block; font-size:12px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 6px;}
input[type=text],input[type=date],textarea,select{width:100%; background:var(--card); border:1px solid var(--line2); border-radius:11px; padding:12px 13px; color:var(--ink); font-size:15px; font-family:inherit;}
textarea{resize:vertical; min-height:64px;}
.chiplist{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:9px 13px; border-radius:11px; background:var(--card); border:1px solid var(--line2); font-size:13.5px; color:var(--ink2); font-weight:600;}
.chip.sel{background:var(--amber-d); border-color:var(--amber); color:var(--amber);}
.btnrow{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:14.5px;}
.btn.primary{background:var(--amber); color:#1a1206;}
.btn.ghost{background:var(--card); color:var(--ink2); border:1px solid var(--line2);}
.btn.danger{background:var(--red-d); color:var(--red);}

/* Checklist items */
.checkitem{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
.checkitem:last-child{border-bottom:none;}
.check{width:23px; height:23px; border-radius:7px; border:2px solid var(--line2); flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent;}
.check.on{background:var(--teal); border-color:var(--teal); color:#0b201c;}
.checklabel{flex:1; font-size:14.5px; line-height:1.3;}
.checklabel.on{color:var(--ink3); text-decoration:line-through;}
.checksub{font-size:11.5px; color:var(--ink3); margin-top:1px;}
.statebtns{display:flex; gap:6px; flex:none;}
.sbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);font-size:14px;color:var(--ink3);}
.sbtn.good.on{background:var(--teal-d); border-color:var(--teal); color:var(--teal);}
.sbtn.bad.on{background:var(--red-d); border-color:var(--red); color:var(--red);}
.grouphead{font-size:12px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.4px; margin:18px 0 4px; padding-left:2px;}
.grouphead:first-child{margin-top:2px;}

.addrow{display:flex; gap:8px; margin-top:10px;}
.addrow input{flex:1;}
.addrow button{width:44px; border-radius:11px; background:var(--card2); border:1px solid var(--line2); color:var(--amber); font-size:20px;}

.catprodcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
.catprodcard .rowtop{margin-bottom:6px;}
.ingr{font-size:12.5px; color:var(--ink3); line-height:1.5;}
.smallx{background:none; border:none; color:var(--ink3); font-size:18px; padding:2px 6px;}

.toast{position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%); background:var(--card2); border:1px solid var(--line2); color:var(--ink); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

/* Print */
@media print{
  header.top,nav.tabbar,.fab,.pillnav,.no-print{display:none!important;}
  body{background:#fff; color:#000; padding:0;}
  .view{display:block!important;}
  .card{border:1px solid #ccc; break-inside:avoid;}
  .check{border-color:#000;}
}
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="brand">
      <div class="mark">✓</div>
      <div class="txt">To Do List<small>JGK Fernández</small></div>
    </div>
    <button class="iconbtn no-print" onclick="window.print()">⎙</button>
  </div>
</header>

<!-- ===== EVENTOS LIST ===== -->
<main>
  <div id="view-eventos" class="view active">
    <div class="pillnav no-print">
      <button class="pill active" data-f="todos" onclick="filtrarEventos('todos',this)">Todos</button>
      <button class="pill" data-f="pend" onclick="filtrarEventos('pend',this)">Pendientes</button>
      <button class="pill" data-f="listo" onclick="filtrarEventos('listo',this)">Listos</button>
    </div>
    <div id="eventosList"></div>
  </div>

  <!-- ===== EVENTO DETALLE ===== -->
  <div id="view-detalle" class="view">
    <div id="detalleHeaderCard"></div>
    <div class="pillnav no-print" id="detalleTabs">
      <button class="pill active" data-tab="compras" onclick="switchDetTab('compras',this)">🛒 Compras</button>
      <button class="pill" data-tab="inspeccion" onclick="switchDetTab('inspeccion',this)">🔧 Inspección</button>
      <button class="pill" data-tab="alistamiento" onclick="switchDetTab('alistamiento',this)">📋 Alistamiento</button>
    </div>
    <div id="detalleBody"></div>
  </div>

  <!-- ===== REPARACIONES ===== -->
  <div id="view-reparaciones" class="view">
    <h2 style="font-size:19px; margin-bottom:12px;">Reparaciones</h2>
    <div id="reparacionesList"></div>
  </div>

  <!-- ===== CATALOGO ===== -->
  <div id="view-catalogo" class="view">
    <div class="pillnav no-print">
      <button class="pill active" data-c="productos" onclick="switchCat('productos',this)">🍔 Productos</button>
      <button class="pill" data-c="equipos" onclick="switchCat('equipos',this)">🎪 Equipos</button>
      <button class="pill" data-c="alistgen" onclick="switchCat('alistgen',this)">👤 Personal / General</button>
    </div>
    <div id="catBody"></div>
  </div>
</main>

<button class="fab no-print" id="fabBtn" onclick="onFab()">+</button>

<nav class="tabbar no-print">
  <button class="active" data-v="eventos" onclick="switchMain('eventos')"><span class="ic">🗓️</span>Eventos</button>
  <button data-v="reparaciones" onclick="switchMain('reparaciones')"><span class="ic">🛠️</span>Reparar</button>
  <button data-v="catalogo" onclick="switchMain('catalogo')"><span class="ic">📚</span>Catálogo</button>
</nav>

<div class="sheetbg no-print" id="sheetbg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDEMPKn-7GemMVVF4Yf7cYGDzrSoSrelbc",
  authDomain:        "chispekas-24448.firebaseapp.com",
  projectId:         "chispekas-24448",
  storageBucket:     "chispekas-24448.firebasestorage.app",
  messagingSenderId: "420833748478",
  appId:             "1:420833748478:web:b6fc5480045f8c3c65ccaf"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

/* ---------- Colecciones ----------
  todolist_productos   {id, nombre, categoria, ingredientes:[string]}
  todolist_equipos     {id, nombre, tipo, items:[string]}
  todolist_general     {id, texto, grupo}  // items de "alistamiento general / personal", reutilizables en todo evento
  todolist_eventos     {id, nombre, fecha, negocio, estado, productos:[id], equipos:[id],
                         compras:[{id,texto,checked}], inspeccion:[{id,equipo,texto,estado}],
                         alistamiento:[{id,texto,checked}]}
  todolist_reparaciones{id, equipo, problema, eventoNombre, fecha, resuelto}
------------------------------------ */

let PRODUCTOS=[], EQUIPOS=[], GENERAL=[], EVENTOS=[], REPARACIONES=[];
let CK_PRODUCTS=[], CK_RESERVATIONS=[]; // catálogo y reservas de CHISPEKAS (solo lectura)
let currentEventoId=null, currentDetTab='compras', currentMainView='eventos', currentCatTab='productos', eventFilter='todos';
let _syncTimer=null;
function scheduleSync(){ clearTimeout(_syncTimer); _syncTimer=setTimeout(syncReservasConfirmadas, 400); }

function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Seed inicial del catálogo (solo si está vacío) ---------- */
async function seedCatalogoSiVacio(){
  const snapP = await db.collection('todolist_productos').limit(1).get();
  if(snapP.empty){
    const productos = [
      {nombre:"Hamburguesa", categoria:"Salado", ingredientes:["Pan","Carne","Queso","Lechuga","Tomate","Papas al hilo","Kétchup","Mostaza","Envoltura/cajita"]},
      {nombre:"Mini hamburguesa", categoria:"Salado", ingredientes:["Pan","Carne","Queso","Lechuga","Tomate","Papas al hilo","Kétchup","Mostaza","Envoltura/cajita"]},
      {nombre:"Salchipapa", categoria:"Salado", ingredientes:["Papa","Salchicha","Aceite","Sal","Kétchup","Mayonesa","Empaque","Tenedor"]},
      {nombre:"Pancho / hot dog", categoria:"Salado", ingredientes:["Pan","Salchicha o jamón","Queso","Kétchup","Mostaza","Mayonesa","Palito","Servilleta"]},
      {nombre:"Pop corn salado", categoria:"Salado", ingredientes:["Maíz pop corn","Mantequilla/margarina","Sal","Envoltura"]},
      {nombre:"Algodón de azúcar", categoria:"Dulce", ingredientes:["Azúcar","Colorante","Palito"]},
      {nombre:"Churros grandes (comprados)", categoria:"Dulce", ingredientes:["Churros","Azúcar","Canela","Servilletas","Bolsa"]},
      {nombre:"Churros pequeños (caseros)", categoria:"Dulce", ingredientes:["Masa","Aceite","Azúcar","Canela"]},
      {nombre:"Helados", categoria:"Dulce", ingredientes:["Helados (comprados)","Servilletas/palitos"]},
      {nombre:"Chicha morada", categoria:"Bebida", ingredientes:["Maíz morado","Canela","Piña","Azúcar","Vasos con tapa y sorbete o botellas"]},
      {nombre:"Manzanas acarameladas", categoria:"Dulce", ingredientes:["Manzanas (compradas listas)"]},
    ];
    const batch = db.batch();
    productos.forEach(p=>{ const ref = db.collection('todolist_productos').doc(); batch.set(ref,p); });
    await batch.commit();
  }
  const snapE = await db.collection('todolist_equipos').limit(1).get();
  if(snapE.empty){
    const equipos = [
      {nombre:"Cámara saltarina / inflable", tipo:"Inflable", items:["Fierros completos","Resortes en buen estado","Malla de seguridad","Motor/soplador funciona","Limpio, sin manchas","Sin roturas"]},
      {nombre:"Extensiones eléctricas", tipo:"Eléctrico", items:["Cable sin cortes","Enchufe en buen estado","Prueba de funcionamiento"]},
      {nombre:"Mesas y sillas", tipo:"Mobiliario", items:["Limpias","Completas","Sin roturas"]},
      {nombre:"Plancha (hamburguesas)", tipo:"Máquina", items:["Enciende","Limpia","Gas/conexión ok"]},
      {nombre:"Freidora (salchipapa/churros)", tipo:"Máquina", items:["Enciende","Limpia","Aceite en buen estado"]},
      {nombre:"Máquina de algodón de azúcar", tipo:"Máquina", items:["Enciende","Limpia","Motor funciona"]},
      {nombre:"Exhibidor de vidrio (churros)", tipo:"Máquina", items:["Enciende","Limpio","Vidrio sin roturas"]},
      {nombre:"Carrito de helados", tipo:"Máquina", items:["Enfría correctamente","Limpio","Ruedas ok"]},
    ];
    const batch = db.batch();
    equipos.forEach(e=>{ const ref = db.collection('todolist_equipos').doc(); batch.set(ref,e); });
    await batch.commit();
  }
  const snapG = await db.collection('todolist_general').limit(1).get();
  if(snapG.empty){
    const general = [
      {texto:"Guantes", grupo:"Uniforme/personal"},
      {texto:"Gorro", grupo:"Uniforme/personal"},
      {texto:"Tapabocas", grupo:"Uniforme/personal"},
      {texto:"Mandil", grupo:"Uniforme/personal"},
      {texto:"Polos del personal limpios", grupo:"Uniforme/personal"},
      {texto:"Servilletas", grupo:"Insumos generales"},
      {texto:"Cajitas/envolturas extra", grupo:"Insumos generales"},
      {texto:"Bolsas de basura", grupo:"Insumos generales"},
    ];
    const batch = db.batch();
    general.forEach(g=>{ const ref = db.collection('todolist_general').doc(); batch.set(ref,g); });
    await batch.commit();
  }
}

/* ---------- Listeners en tiempo real ---------- */
function initListeners(){
  db.collection('todolist_productos').orderBy('nombre').onSnapshot(s=>{
    PRODUCTOS = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='productos') renderCatalogo();
    if(document.getElementById('sheet').dataset.type==='evento') renderEventoFormChips();
    scheduleSync();
  });
  db.collection('todolist_equipos').orderBy('nombre').onSnapshot(s=>{
    EQUIPOS = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='equipos') renderCatalogo();
    if(document.getElementById('sheet').dataset.type==='evento') renderEventoFormChips();
    scheduleSync();
  });
  db.collection('todolist_general').onSnapshot(s=>{
    GENERAL = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='alistgen') renderCatalogo();
    scheduleSync();
  });
  db.collection('todolist_eventos').orderBy('fecha').onSnapshot(s=>{
    EVENTOS = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='eventos') renderEventos();
    if(currentMainView==='detalle' && currentEventoId) renderDetalle();
  });
  db.collection('todolist_reparaciones').orderBy('fecha','desc').onSnapshot(s=>{
    REPARACIONES = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='reparaciones') renderReparaciones();
  });

  // ---- Solo lectura: catálogo y reservas reales de CHISPEKAS ----
  db.collection('products').onSnapshot(s=>{
    CK_PRODUCTS = s.docs.map(d=>({id:d.id,...d.data()}));
    scheduleSync();
  }, err=> console.warn('No se pudo leer products de CHISPEKAS', err));
  db.collection('reservations').onSnapshot(s=>{
    CK_RESERVATIONS = s.docs.map(d=>({id:d.id,...d.data()}));
    scheduleSync();
  }, err=> console.warn('No se pudo leer reservations de CHISPEKAS', err));
}

/* ---------- Sincronización automática con reservas de CHISPEKAS ---------- */
const INSPECCION_GENERICA = {
  inflable:            ["Fierros completos","Resortes en buen estado","Malla de seguridad","Motor/soplador funciona","Limpio, sin manchas","Sin roturas"],
  saltarines:          ["Fierros completos","Resortes en buen estado","Malla de seguridad","Motor/soplador funciona","Limpio, sin manchas","Sin roturas"],
  juegos_infantiles:   ["Piezas completas","Sin roturas","Limpio"],
  mobiliario:          ["Limpio","Completo","Sin roturas"],
};

function computeDesiredCompras(prodIds){
  const out=[];
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    const linked = PRODUCTOS.find(p=>p.chispekasId===pid);
    if(linked){
      (linked.ingredientes||[]).forEach(ing=> out.push({key:`${pid}::${ing}`, texto:ing, checked:false}));
    } else if(ck.category==='snack'){
      out.push({key:`${pid}::insumos`, texto:`Preparar insumos: ${ck.name}`, checked:false});
    }
  });
  return out;
}
function computeDesiredInspeccion(prodIds){
  const out=[];
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    const linked = EQUIPOS.find(e=>e.chispekasId===pid);
    if(linked){
      (linked.items||[]).forEach(it=> out.push({key:`${pid}::${it}`, equipo:ck.name, texto:it, estado:null}));
    } else if(INSPECCION_GENERICA[ck.category]){
      INSPECCION_GENERICA[ck.category].forEach(it=> out.push({key:`${pid}::${it}`, equipo:ck.name, texto:it, estado:null}));
    }
  });
  return out;
}
function computeDesiredAlistamiento(prodIds){
  const out=[];
  GENERAL.forEach(g=> out.push({key:`general::${g.id}`, texto:g.texto, grupo:g.grupo, checked:false}));
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    out.push({key:`${pid}::cargar`, texto:`Cargar: ${ck.name}`, grupo:'Productos del evento', checked:false});
  });
  return out;
}
function mergeItems(existing, desired){
  const exByKey = new Map((existing||[]).filter(i=>i.key).map(i=>[i.key,i]));
  const manual = (existing||[]).filter(i=> !i.key || i.key.startsWith('manual::'));
  const merged = desired.map(d=> exByKey.has(d.key) ? {...exByKey.get(d.key), texto:d.texto, grupo:d.grupo, equipo:d.equipo} : d);
  return [...merged, ...manual];
}
function nombreReserva(r){ return `${r.event||'Evento'}${r.client? ' - '+r.client:''}`.trim(); }

async function syncReservasConfirmadas(){
  if(!CK_RESERVATIONS.length || !CK_PRODUCTS.length) return;
  const confirmadas = CK_RESERVATIONS.filter(r=>r.status==='confirmado');
  for(const r of confirmadas){
    const prodIds = r.products||[];
    const existing = EVENTOS.find(e=>e.origenReservaId===r.id);
    const desiredCompras = computeDesiredCompras(prodIds);
    const desiredInspeccion = computeDesiredInspeccion(prodIds);
    const desiredAlistamiento = computeDesiredAlistamiento(prodIds);
    const nombre = nombreReserva(r);
    if(!existing){
      await db.collection('todolist_eventos').add({
        nombre, fecha:r.date||'', negocio:'CHISPEKAS', estado:'pendiente',
        origenReservaId:r.id, reservaEstado:r.status,
        productos:[], equipos:[],
        compras:desiredCompras, inspeccion:desiredInspeccion, alistamiento:desiredAlistamiento
      });
    } else {
      const compras = mergeItems(existing.compras, desiredCompras);
      const inspeccion = mergeItems(existing.inspeccion, desiredInspeccion);
      const alistamiento = mergeItems(existing.alistamiento, desiredAlistamiento);
      const changed = JSON.stringify(compras)!==JSON.stringify(existing.compras||[])
        || JSON.stringify(inspeccion)!==JSON.stringify(existing.inspeccion||[])
        || JSON.stringify(alistamiento)!==JSON.stringify(existing.alistamiento||[])
        || existing.reservaEstado!==r.status || existing.fecha!==r.date || existing.nombre!==nombre;
      if(changed){
        await db.collection('todolist_eventos').doc(existing.id).update({compras, inspeccion, alistamiento, reservaEstado:r.status, fecha:r.date||existing.fecha||'', nombre});
      }
    }
  }
  // Reservas que dejaron de estar confirmadas: no se borra nada, solo se marca
  EVENTOS.filter(e=>e.origenReservaId).forEach(async e=>{
    const r = CK_RESERVATIONS.find(x=>x.id===e.origenReservaId);
    const nuevoEstado = r? r.status : 'eliminada';
    if(nuevoEstado!==e.reservaEstado){
      await db.collection('todolist_eventos').doc(e.id).update({reservaEstado:nuevoEstado});
    }
  });
}

/* ---------- Progreso ---------- */
function progresoEvento(ev){
  const all = [...(ev.compras||[]), ...(ev.alistamiento||[])];
  const insp = (ev.inspeccion||[]);
  const totalChecks = all.length + insp.length;
  const doneChecks = all.filter(i=>i.checked).length + insp.filter(i=>i.estado).length;
  if(totalChecks===0) return 0;
  return Math.round((doneChecks/totalChecks)*100);
}

/* ---------- RENDER: Eventos ---------- */
function renderEventos(){
  const wrap = document.getElementById('eventosList');
  let list = [...EVENTOS];
  if(eventFilter==='pend') list = list.filter(e=>progresoEvento(e)<100);
  if(eventFilter==='listo') list = list.filter(e=>progresoEvento(e)===100);
  if(list.length===0){
    wrap.innerHTML = `<div class="emptystate"><div class="big">🗓️</div><h3>Sin eventos aquí</h3><p>Crea un evento y se generan solos los checklists de compras, inspección y alistamiento.</p></div>`;
    return;
  }
  wrap.innerHTML = list.map(ev=>{
    const p = progresoEvento(ev);
    let badge = p===100 ? `<span class="badge ok">Listo</span>` : `<span class="badge pend">${p}%</span>`;
    if(ev.origenReservaId && ev.reservaEstado && ev.reservaEstado!=='confirmado'){
      badge = `<span class="badge warn">⚠️ Reserva: ${esc(ev.reservaEstado)}</span>`;
    }
    const link = ev.origenReservaId? `<span title="Sincronizado con CHISPEKAS">🔗</span> `:'';
    return `<div class="card tap" onclick="goDetalle('${ev.id}')">
      <div class="rowtop">
        <div><div class="evname">${link}${esc(ev.nombre)}</div><div class="evmeta">${fmtFecha(ev.fecha)}${ev.negocio? ' · '+esc(ev.negocio):''}</div></div>
        ${badge}
      </div>
      <div class="progwrap"><div class="progbar" style="width:${p}%"></div></div>
    </div>`;
  }).join('');
}

function fmtFecha(f){
  if(!f) return '';
  const [y,m,d] = f.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[parseInt(m)-1]} ${y}`;
}
function esc(s){ return (s||'').toString().replace(/</g,'&lt;'); }

async function guardarEvento(){
  const nombre = document.getElementById('fNombre').value.trim();
  const fecha = document.getElementById('fFecha').value;
  const negocio = document.getElementById('fNegocio').value;
  if(!nombre || !fecha){ toast('Falta nombre o fecha'); return; }
  const sheet = document.getElementById('sheet');
  const prodIds = [...(sheet._selProd||[])];
  const equipIds = [...(sheet._selEquip||[])];

  // Generar Compras: unión deduplicada de ingredientes
  const ingrSet = new Map();
  prodIds.forEach(pid=>{
    const p = PRODUCTOS.find(x=>x.id===pid);
    if(p) (p.ingredientes||[]).forEach(ing=>{ ingrSet.set(ing.toLowerCase(), {texto:ing, producto:p.nombre}); });
  });
  const compras = [...ingrSet.values()].map(v=>({id:uid(), texto:v.texto, checked:false}));

  // Generar Inspección: items por equipo
  const inspeccion = [];
  equipIds.forEach(eid=>{
    const e = EQUIPOS.find(x=>x.id===eid);
    if(e) (e.items||[]).forEach(it=>{ inspeccion.push({id:uid(), equipo:e.nombre, texto:it, estado:null}); });
  });

  // Generar Alistamiento: general (uniformes/insumos) + productos + equipos como "cargar"
  const alistamiento = [];
  GENERAL.forEach(g=> alistamiento.push({id:uid(), texto:g.texto, grupo:g.grupo, checked:false}));
  prodIds.forEach(pid=>{ const p=PRODUCTOS.find(x=>x.id===pid); if(p) alistamiento.push({id:uid(), texto:`Cargar insumos: ${p.nombre}`, grupo:'Productos', checked:false}); });
  equipIds.forEach(eid=>{ const e=EQUIPOS.find(x=>x.id===eid); if(e) alistamiento.push({id:uid(), texto:`Cargar: ${e.nombre}`, grupo:'Equipos', checked:false}); });

  await db.collection('todolist_eventos').add({
    nombre, fecha, negocio, estado:'pendiente',
    productos:prodIds, equipos:equipIds,
    compras, inspeccion, alistamiento
  });
  closeSheet();
  toast('Evento creado');
}

async function toggleCompra(evId, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const compras = (ev.compras||[]).map(i=> i.id===itemId? {...i, checked:!i.checked}: i);
  await db.collection('todolist_eventos').doc(evId).update({compras});
}
async function toggleAlist(evId, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const alistamiento = (ev.alistamiento||[]).map(i=> i.id===itemId? {...i, checked:!i.checked}: i);
  await db.collection('todolist_eventos').doc(evId).update({alistamiento});
}
async function setInspeccion(evId, itemId, estado){
  const ev = EVENTOS.find(e=>e.id===evId);
  let itemRef=null;
  const inspeccion = (ev.inspeccion||[]).map(i=>{
    if(i.id===itemId){ const nuevo = i.estado===estado? null: estado; itemRef={...i, estado:nuevo}; return itemRef; }
    return i;
  });
  await db.collection('todolist_eventos').doc(evId).update({inspeccion});
  if(itemRef && itemRef.estado==='malo'){
    await db.collection('todolist_reparaciones').add({
      equipo:itemRef.equipo, problema:itemRef.texto, eventoNombre:ev.nombre,
      fecha:new Date().toISOString().slice(0,10), resuelto:false
    });
    toast('Se agregó a Reparaciones');
  }
}
async function addItemEvento(evId, campo){
  const inputId = campo==='compras'?'addCompra':'addAlist';
  const val = document.getElementById(inputId).value.trim();
  if(!val) return;
  const ev = EVENTOS.find(e=>e.id===evId);
  const arr = [...(ev[campo]||[]), {id:uid(), key:`manual::${uid()}`, texto:val, checked:false, grupo: campo==='alistamiento'?'Otros':undefined}];
  await db.collection('todolist_eventos').doc(evId).update({[campo]:arr});
  document.getElementById(inputId).value='';
}
async function eliminarItemEvento(evId, campo, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const arr = (ev[campo]||[]).filter(i=>i.id!==itemId);
  await db.collection('todolist_eventos').doc(evId).update({[campo]:arr});
}

  }
  if(currentCatTab==='equipos'){
    if(EQUIPOS.length===0){ wrap.innerHTML=`<div class="emptystate"><div class="big">🎪</div><p>Sin equipos aún.</p></div>`; return; }
    wrap.innerHTML = EQUIPOS.map(e=>`
      <div class="catprodcard">
        <div class="rowtop">
          <div class="evname">${esc(e.nombre)} <span class="ingr">· ${esc(e.tipo||'')}</span></div>
          <div><button class="smallx" onclick="openEquipoForm('${e.id}')">✎</button><button class="smallx" onclick="borrarDoc('todolist_equipos','${e.id}')">✕</button></div>
        </div>
        <div class="ingr">${(e.items||[]).join(' · ')}</div>
        ${e.chispekasId? `<div class="ingr" style="color:var(--teal); margin-top:4px">🔗 ${esc((CK_PRODUCTS.find(c=>c.id===e.chispekasId)||{}).name||'vinculado')}</div>`:''}
      </div>`).join('');
  }
  if(currentCatTab==='alistgen'){
    if(GENERAL.length===0){ wrap.innerHTML=`<div class="emptystate"><div class="big">👤</div><p>Sin items generales aún.</p></div>`; return; }
    const grupos={};
    GENERAL.forEach(g=>{ (grupos[g.grupo||'Otros']=grupos[g.grupo||'Otros']||[]).push(g); });
    let html='';
    Object.keys(grupos).forEach(gr=>{
      html += `<div class="grouphead">${esc(gr)}</div><div class="card">`;
      html += grupos[gr].map(g=>`<div class="checkitem"><div class="checklabel">${esc(g.texto)}</div><button class="smallx" onclick="borrarDoc('todolist_general','${g.id}')">✕</button></div>`).join('');
      html += `</div>`;
    });
    wrap.innerHTML = html;
  }
}
async function borrarDoc(col,id){ await db.collection(col).doc(id).delete(); toast('Eliminado'); }

function openProductoForm(id){
  const p = id? PRODUCTOS.find(x=>x.id===id): null;
  const sheet = document.getElementById('sheet');
  sheet.dataset.type='producto'; sheet.dataset.id = id||'';
  sheet.innerHTML = `
    <div class="grabber"></div><h2>${p?'Editar':'Nuevo'} producto</h2>
    <label class="f">Nombre</label><input type="text" id="pNombre" value="${p?esc(p.nombre):''}">
    <label class="f">Categoría</label>
    <select id="pCategoria">
      ${['Salado','Dulce','Bebida','Otro'].map(c=>`<option ${p&&p.categoria===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <label class="f">Ingredientes / insumos (sin cantidad, uno por línea)</label>
    <textarea id="pIngredientes" rows="6">${p?p.ingredientes.join('\n'):''}</textarea>
    <label class="f">Vincular a producto real de CHISPEKAS (opcional)</label>
    <select id="pChispekasId">
      <option value="">— sin vincular —</option>
      ${CK_PRODUCTS.map(ck=>`<option value="${ck.id}" ${p&&p.chispekasId===ck.id?'selected':''}>${esc(ck.emoji||'')} ${esc(ck.name)}</option>`).join('')}
    </select>
    <div class="ingr" style="margin-top:6px">Si lo vinculas, cada vez que ese producto aparezca en una reserva confirmada de CHISPEKAS, se generará solo esta lista de compras.</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
      ${p?`<button class="btn danger" onclick="borrarDoc('todolist_productos','${id}');closeSheet()">Eliminar</button>`:''}
      <button class="btn primary" onclick="guardarProducto()">Guardar</button>
    </div>`;
  openSheet();
}
async function guardarProducto(){
  const id = document.getElementById('sheet').dataset.id;
  const nombre = document.getElementById('pNombre').value.trim();
  const categoria = document.getElementById('pCategoria').value;
  const ingredientes = document.getElementById('pIngredientes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const chispekasId = document.getElementById('pChispekasId').value || null;
  if(!nombre){ toast('Falta el nombre'); return; }
  const data = {nombre, categoria, ingredientes, chispekasId};
  if(id) await db.collection('todolist_productos').doc(id).update(data);
  else await db.collection('todolist_productos').add(data);
  closeSheet(); toast('Guardado');
}

function openEquipoForm(id){
  const e = id? EQUIPOS.find(x=>x.id===id): null;
  const sheet = document.getElementById('sheet');
  sheet.dataset.type='equipo'; sheet.dataset.id = id||'';
  sheet.innerHTML = `
    <div class="grabber"></div><h2>${e?'Editar':'Nuevo'} equipo</h2>
    <label class="f">Nombre</label><input type="text" id="eNombre" value="${e?esc(e.nombre):''}">
    <label class="f">Tipo</label>
    <select id="eTipo">${['Inflable','Mobiliario','Eléctrico','Máquina','Otro'].map(c=>`<option ${e&&e.tipo===c?'selected':''}>${c}</option>`).join('')}</select>
    <label class="f">Puntos de inspección (uno por línea)</label>

    <label class="f">Vincular a producto real de CHISPEKAS (opcional)</label>

      <option value="">— sin vincular —</option>
      ${CK_PRODUCTS.map(ck=>`<option value="${ck.id}" ${e&&e.chispekasId===ck.id?'selected':''}>${esc(ck.emoji||'')} ${esc(ck.name)}</option>`).join('')}
    </select>
    <div class="ingr" style="margin-top:6px">Sin vincular igual se genera una inspección genérica según su categoría (inflable, mobiliario, etc).</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>

async function guardarEquipo(){
  const id = document.getElementById('sheet').dataset.id;
  const nombre = document.getElementById('eNombre').value.trim();
  const tipo = document.getElementById('eTipo').value;
  const items = document.getElementById('eItems').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const chispekasId = document.getElementById('eChispekasId').value || null;
  if(!nombre){ toast('Falta el nombre'); return; }
  const data = {nombre, tipo, items, chispekasId};
  if(id) await db.collection('todolist_equipos').doc(id).update(data);
  else await db.collection('todolist_equipos').add(data);
  closeSheet(); toast('Guardado');
}

function openGeneralForm(){
  const sheet = document.getElementById('sheet');
  sheet.dataset.type='general';
  sheet.innerHTML = `
    <div class="grabber"></div><h2>Nuevo item general</h2>
    <label class="f">Texto</label><input type="text" id="gTexto" placeholder="Ej. Guantes">
    <label class="f">Grupo</label>
    <select id="gGrupo"><option>Uniforme/personal</option><option>Insumos generales</option><option>Otros</option></select>
    <div class="btnrow"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="guardarGeneral()">Guardar</button></div>`;
  openSheet();
}
async function guardarGeneral(){
  const texto = document.getElementById('gTexto').value.trim();
  const grupo = document.getElementById('gGrupo').value;
  if(!texto){ toast('Falta el texto'); return; }
  await db.collection('todolist_general').add({texto, grupo});
  closeSheet(); toast('Guardado');
}

/* ---------- Sheet helpers ---------- */
function openSheet(){ document.getElementById('sheetbg').classList.add('show'); }
function closeSheet(){ document.getElementById('sheetbg').classList.remove('show'); document.getElementById('sheet').innerHTML=''; document.getElementById('sheet').dataset.type=''; }

/* ---------- Init ---------- */
(async function init(){
  await seedCatalogoSiVacio();
  initListeners();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('jgk-todolist-sw.js').catch(()=>{});
  });
}
</script>
