<style>

  body{background:#f0f0f2;color:var(--t);padding:18px;padding-bottom:60px}
  .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.04)}
  h1{font-size:19px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--t2);font-size:12.5px;margin-bottom:14px}

  .btn-dark{background:#1d1d1f;color:#fff}
  .btn-outline{background:#fff;color:var(--t);border:1.5px solid var(--bd)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .kpi{background:var(--s2);border-radius:12px;padding:12px;border:1px solid var(--bd)}
  .kpi b{display:block;font-size:20px;font-weight:800}
  .kpi span{font-size:11px;color:var(--t2)}

  .b-ok{background:#f0fdf4;color:var(--gr)}
  .b-warn{background:#fffbeb;color:#b45309}
  .b-err{background:#fef2f2;color:var(--rd)}
  .hide{display:none}
  #whoami{font-size:12px;color:var(--t2);margin-bottom:8px}
</style>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();

const logEl = document.getElementById("log");
const cardLog = document.getElementById("card-log");
function log(msg, cls){
  cardLog.classList.remove("hide");
  const line = document.createElement("div");
  line.textContent = msg;
  if(cls==="ok") line.style.color = "#6ee7b7";
  if(cls==="warn") line.style.color = "#fcd34d";
  if(cls==="err") line.style.color = "#fca5a5";
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

let existingProducts = [];
let existingReservations = [];
let previewDone = false;

document.getElementById("btn-login").onclick = () => signInWithPopup(auth, provider).catch(e => alert("Error al iniciar sesión: " + e.message));
document.getElementById("btn-logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  const who = document.getElementById("whoami");
  const cardActions = document.getElementById("card-actions");
  if(user){
    who.textContent = "Conectado como " + (user.email || user.displayName);
    document.getElementById("btn-login").classList.add("hide");
    document.getElementById("btn-logout").classList.remove("hide");
    cardActions.classList.remove("hide");
  } else {
    who.textContent = "";
    document.getElementById("btn-login").classList.remove("hide");
    document.getElementById("btn-logout").classList.add("hide");
    cardActions.classList.add("hide");
  }
});

async function loadExisting(){
  const [ps, rs] = await Promise.all([
    getDocs(collection(db, "products")),
    getDocs(collection(db, "reservations"))
  ]);
  existingProducts = ps.docs.map(d => d.data());
  existingReservations = rs.docs.map(d => d.data());
}

function findExistingProduct(name){
  const n = norm(name);
  return existingProducts.find(p => norm(p.name) === n);
}

function findExistingReservation(client, dateStr){
  const c = norm(client);
  return existingReservations.find(r => norm(r.client) === c && r.date === dateStr);
}

document.getElementById("btn-preview").onclick = async () => {
  log("Cargando datos actuales de Firebase…");
  await loadExisting();
  log(`Productos ya existentes en tu app: ${existingProducts.length}`, "ok");
  log(`Reservas ya existentes en tu app: ${existingReservations.length}`, "ok");

  let newProducts = 0, matchedProducts = 0;
  CATALOG_PRODUCTS.forEach(p => {
    if(findExistingProduct(p.name)) matchedProducts++; else newProducts++;
  });
  log(`→ Productos que se crearán: ${newProducts}`, newProducts ? "warn" : "ok");
  log(`→ Productos que ya existen y se reutilizarán: ${matchedProducts}`, "ok");

  let newRes = 0, dupRes = 0;
  RESERVATIONS.forEach(r => {
    if(findExistingReservation(r.client, r.date)) dupRes++; else newRes++;
  });
  log(`→ Reservas nuevas que se crearán: ${newRes}`, newRes ? "warn" : "ok");
  log(`→ Reservas que parecen duplicadas (mismo cliente + fecha) y se omitirán: ${dupRes}`, dupRes ? "warn" : "ok");
  log("Vista previa lista. Nada se ha guardado todavía.", "ok");

  previewDone = true;
  document.getElementById("btn-import").disabled = false;
  document.getElementById("preview-hint").textContent = "Listo para importar. Esto SÍ escribirá datos en Firebase.";
};

document.getElementById("btn-import").onclick = async () => {
  if(!previewDone){ alert("Corre primero la vista previa."); return; }
  if(!confirm("¿Importar " + RESERVATIONS.length + " reservas y crear los productos del catálogo que falten en Firebase? Esta acción no se puede deshacer fácilmente.")) return;

  document.getElementById("btn-import").disabled = true;
  document.getElementById("btn-preview").disabled = true;
  log("=== Iniciando importación ===");

  // 1. Productos: crear los que falten
  const slugToId = {};
  for(const p of CATALOG_PRODUCTS){
    const existing = findExistingProduct(p.name);
    if(existing){
      slugToId[p.slug] = existing.id;
    } else {
      const newId = "p" + uid();
      const data = { id: newId, name: p.name, category: p.category, price: p.price, available: true, stock: 1, description: "", emoji: p.emoji, photo: null };
      await setDoc(doc(db, "products", newId), data);
      existingProducts.push(data);
      slugToId[p.slug] = newId;
      log("✅ Producto creado: " + p.name, "ok");
    }
  }

  // 2. Reservas
  let created = 0, skipped = 0;
  for(const r of RESERVATIONS){
    if(findExistingReservation(r.client, r.date)){
      skipped++;
      continue;
    }
    const newId = "r" + uid();
    const productIds = (r.productSlugs || []).map(s => slugToId[s]).filter(Boolean);
    const data = {
      id: newId, client: r.client, event: r.event, date: r.date, phone: r.phone, email: r.email,
      horaInicio: r.horaInicio, horaFin: r.horaFin, payStatus: r.payStatus, status: r.status,
      dni: r.dni, ruc: r.ruc, razon: r.razon, direccion: r.direccion, distrito: r.distrito,
      notes: r.notes, source: r.source, products: productIds, total: r.total, discount: r.discount,
      extras: r.extras, adelanto: r.adelanto, rating: r.rating, review: r.review, changelog: []
    };
    await setDoc(doc(db, "reservations", newId), data);
    existingReservations.push(data);
    created++;
    if(created % 20 === 0) log(`… ${created} reservas creadas`, "ok");
  }

  log(`=== Listo ===`, "ok");
  log(`Reservas creadas: ${created}`, "ok");
  log(`Reservas omitidas (ya existían): ${skipped}`, skipped ? "warn" : "ok");
  log("Abre tu app CHISPEKAS y revisa la sección de Reservas.", "ok");
  alert("Importación terminada: " + created + " reservas creadas, " + skipped + " omitidas.");
};
</script>
