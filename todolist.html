<style>
:root{
  --bg:#15130F; --bg2:#1C1913; --card:#221E17; --card2:#2A251C;
  --line:#38321F; --line2:#463D26;
  --ink:#F3EDE0; --ink2:#B8AE97; --ink3:#7C7358;
  --amber:#E8A33D; --amber-d:#3A2A12;
  --teal:#4FB0A5; --teal-d:#12312D;
  --red:#E2634F; --red-d:#3A1B15;
  --radius:16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; padding-bottom:calc(84px + var(--safe-b)); overscroll-behavior-y:none;}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; margin:0;}
::selection{background:var(--amber); color:#15130F;}

/* Header */
header.top{position:sticky; top:0; z-index:30; background:rgba(21,19,15,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding:14px 18px calc(12px + env(safe-area-inset-top,0px)); padding-top:calc(14px + env(safe-area-inset-top,0px));}
.brandrow{display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--amber),#c97e1f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:15px;}
.brand .txt{font-weight:700; font-size:16px; letter-spacing:-.2px;}
.brand .txt small{display:block; font-weight:500; font-size:11px; color:var(--ink3); letter-spacing:.3px;}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:16px;}

/* Section subnav (pills) */
.pillnav{display:flex; gap:8px; padding:12px 16px 4px; overflow-x:auto; scrollbar-width:none;}
.pillnav::-webkit-scrollbar{display:none;}
.pill{flex:none; padding:9px 15px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--ink2); font-size:13.5px; font-weight:600; white-space:nowrap;}
.pill.active{background:var(--amber); border-color:var(--amber); color:#1a1206;}
.pill .cnt{opacity:.65; font-weight:700; margin-left:4px;}

main{padding:14px 16px 24px;}
.view{display:none;}
.view.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* Cards */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.card.tap{cursor:pointer;}
.rowtop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.evname{font-weight:700; font-size:15.5px;}
.evmeta{color:var(--ink3); font-size:12.5px; margin-top:2px;}
.badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; letter-spacing:.2px;}
.badge.pend{background:var(--amber-d); color:var(--amber);}
.badge.ok{background:var(--teal-d); color:var(--teal);}
.badge.warn{background:var(--red-d); color:var(--red);}
.progwrap{height:5px; border-radius:99px; background:var(--line); margin-top:12px; overflow:hidden;}
.progbar{height:100%; background:var(--amber); border-radius:99px; transition:width .25s;}

.emptystate{text-align:center; padding:48px 20px; color:var(--ink3);}
.emptystate .big{font-size:34px; margin-bottom:10px;}
.emptystate p{font-size:13.5px; line-height:1.5; max-width:280px; margin:6px auto 0;}

/* FAB */
.fab{position:fixed; right:18px; bottom:calc(90px + var(--safe-b)); width:54px; height:54px; border-radius:17px; background:var(--amber); color:#1a1206; border:none; font-size:26px; font-weight:400; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px -6px rgba(232,163,61,.55); z-index:25;}

/* Bottom tab bar */
nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(21,19,15,.94); backdrop-filter:blur(16px); border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + var(--safe-b));}
nav.tabbar button{flex:1; background:none; border:none; color:var(--ink3); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; padding:6px 0;}
nav.tabbar button .ic{font-size:19px;}
nav.tabbar button.active{color:var(--amber);}

/* Sheet (modal) */
.sheetbg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:none; align-items:flex-end;}
.sheetbg.show{display:flex;}
.sheet{background:var(--bg2); width:100%; max-height:88vh; border-radius:22px 22px 0 0; overflow-y:auto; padding:10px 18px calc(24px + var(--safe-b)); animation:up .22s ease;}
@keyframes up{from{transform:translateY(24px); opacity:.4;} to{transform:none; opacity:1;}}
.sheet .grabber{width:36px;height:4px;background:var(--line2);border-radius:99px;margin:8px auto 14px;}
.sheet h2{font-size:18px; margin-bottom:14px;}
label.f{display:block; font-size:12px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 6px;}
input[type=text],input[type=date],textarea,select{width:100%; background:var(--card); border:1px solid var(--line2); border-radius:11px; padding:12px 13px; color:var(--ink); font-size:15px; font-family:inherit;}
textarea{resize:vertical; min-height:64px;}
.chiplist{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:9px 13px; border-radius:11px; background:var(--card); border:1px solid var(--line2); font-size:13.5px; color:var(--ink2); font-weight:600;}
.chip.sel{background:var(--amber-d); border-color:var(--amber); color:var(--amber);}
.btnrow{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:14.5px;}
.btn.primary{background:var(--amber); color:#1a1206;}
.btn.ghost{background:var(--card); color:var(--ink2); border:1px solid var(--line2);}
.btn.danger{background:var(--red-d); color:var(--red);}

/* Checklist items */
.checkitem{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
.checkitem:last-child{border-bottom:none;}
.check{width:23px; height:23px; border-radius:7px; border:2px solid var(--line2); flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent;}
.check.on{background:var(--teal); border-color:var(--teal); color:#0b201c;}
.check.bad{background:var(--red); border-color:var(--red); color:#2a0e09;}
.checklabel{flex:1; font-size:14.5px; line-height:1.3;}
.checklabel.on{color:var(--ink3); text-decoration:line-through;}
.checksub{font-size:11.5px; color:var(--ink3); margin-top:1px;}
.grouphead{font-size:12px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.4px; margin:18px 0 4px; padding-left:2px;}
.grouphead:first-child{margin-top:2px;}

.addrow{display:flex; gap:8px; margin-top:10px;}
.addrow input{flex:1;}
.addrow button{width:44px; border-radius:11px; background:var(--card2); border:1px solid var(--line2); color:var(--amber); font-size:20px;}

.catprodcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
.catprodcard .rowtop{margin-bottom:6px;}
.ingr{font-size:12.5px; color:var(--ink3); line-height:1.5;}
.smallx{background:none; border:none; color:var(--ink3); font-size:18px; padding:2px 6px;}

.toast{position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%); background:var(--card2); border:1px solid var(--line2); color:var(--ink); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

/* Print */
#printArea{display:none;}
@media print{
  header.top,nav.tabbar,.fab,.pillnav,.no-print,main,.sheetbg{display:none!important;}
  body{background:#fff; color:#000; padding:0;}
  #printArea{display:block!important; padding:12px;}
  #printArea h1{font-size:20px; margin-bottom:2px;}
  #printArea .pmeta{font-size:12px; color:#555; margin-bottom:16px;}
  #printArea h2{font-size:14px; text-transform:uppercase; letter-spacing:.5px; margin:18px 0 6px; border-bottom:2px solid #000; padding-bottom:3px;}
  #printArea .pgroup{font-size:11.5px; font-weight:700; color:#444; margin:10px 0 2px;}
  #printArea .pitem{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; break-inside:avoid;}
  #printArea .pbox{width:14px; height:14px; border:1.5px solid #000; flex:none; border-radius:3px;}
  #printArea .pempty{text-align:center; color:#888; font-size:12px; padding:6px 0;}
}
</style>
</head>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDEMPKn-7GemMVVF4Yf7cYGDzrSoSrelbc",
  authDomain:        "chispekas-24448.firebaseapp.com",
  projectId:         "chispekas-24448",
  storageBucket:     "chispekas-24448.firebasestorage.app",
  messagingSenderId: "420833748478",

};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

/* ---------- Colecciones ----------
  todolist_productos   {id, nombre, categoria, ingredientes:[string]}
  todolist_equipos     {id, nombre, tipo, items:[string]}
  todolist_general     {id, texto, grupo}  // items de "alistamiento general / personal", reutilizables en todo evento
  todolist_eventos     {id, nombre, fecha, negocio, estado, productos:[id], equipos:[id],
                         compras:[{id,texto,checked}], inspeccion:[{id,equipo,texto,estado}],
                         alistamiento:[{id,texto,checked}]}
  todolist_reparaciones{id, equipo, problema, eventoNombre, fecha, resuelto}
------------------------------------ */

let PRODUCTOS=[], EQUIPOS=[], GENERAL=[], EVENTOS=[], REPARACIONES=[];
let CK_PRODUCTS=[], CK_RESERVATIONS=[]; // catálogo y reservas de CHISPEKAS (solo lectura)
const DIAG = {errores:{}};
let currentEventoId=null, currentDetTab='compras', currentMainView='eventos', currentCatTab='productos', eventFilter='proximos';
let _syncTimer=null;
function scheduleSync(){ clearTimeout(_syncTimer); _syncTimer=setTimeout(syncReservasConfirmadas, 400); }

function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Migración versionada del catálogo ----------
   Si la versión guardada es menor a CATALOGO_VERSION, se borra el catálogo
   viejo y se crea de nuevo con la info correcta. Así se corrige solo en tu
   app ya publicada, sin que tengas que borrar nada a mano. */
const CATALOGO_VERSION = 2;

async function borrarColeccion(nombre){
  const snap = await db.collection(nombre).get();
  if(snap.empty) return;
  const batch = db.batch();
  snap.docs.forEach(d=>batch.delete(d.ref));
  await batch.commit();
}

async function seedCatalogoSiVacio(){
  const metaRef = db.collection('todolist_meta').doc('catalogo');
  const metaSnap = await metaRef.get();
  const versionActual = metaSnap.exists ? (metaSnap.data().version||0) : 0;
  if(versionActual >= CATALOGO_VERSION) return;

  await borrarColeccion('todolist_productos');
  await borrarColeccion('todolist_equipos');
  await borrarColeccion('todolist_general');

  // ---- Equipos: incluye tanto estructuras (inflables/mobiliario) como máquinas de snacks ----
  const equipos = [
    {nombre:"Saltarín / cama saltarina", tipo:"Saltarín", items:["Malla de seguridad","Resortes en buen estado","Fierros completos","Sin roturas, bien cosido"]},
    {nombre:"Inflable", tipo:"Inflable", items:["Motor/soplador funciona","Limpio, sin manchas","Sin roturas, bien cosido"]},
    {nombre:"Juegos infantiles", tipo:"Juegos infantiles", items:["Limpio"]},
    {nombre:"Mesas y sillas (mobiliario)", tipo:"Mobiliario", items:["Limpio"]},
    {nombre:"Plancha", tipo:"Máquina", items:["Enciende","Limpia"]},
    {nombre:"Freidora", tipo:"Máquina", items:["Enciende","Limpia","Aceite en buen estado"]},
    {nombre:"Máquina de algodón de azúcar", tipo:"Máquina", items:["Enciende","Limpia","Motor funciona"]},
    {nombre:"Máquina de pop corn", tipo:"Máquina", items:["Enciende","Limpia"]},
    {nombre:"Vitrina / exhibidor de churros", tipo:"Máquina", items:["Enciende","Limpia"]},
    {nombre:"Carrito de helados (con baterías)", tipo:"Máquina", items:["Baterías cargadas / enfriando bien","Limpio"]},
    {nombre:"Dispensador de chicha morada", tipo:"Máquina", items:["Limpio","Funciona bien"]},
  ];
  const idsEquipo = {};
  const batchE = db.batch();
  equipos.forEach(e=>{ const ref = db.collection('todolist_equipos').doc(); idsEquipo[e.nombre]=ref.id; batchE.set(ref,e); });
  await batchE.commit();

  // ---- Productos (snacks): ingredientes sin cantidad + equipo(s) que requieren ----
  const productos = [
    {nombre:"Pop corn", categoria:"Salado", ingredientes:["Maíz pop corn","Sal","Aceite","Cono/envoltura para pop corn"], equiposRequeridos:[idsEquipo["Máquina de pop corn"]]},
    {nombre:"Salchipapa", categoria:"Salado", ingredientes:["Papa","Aceite","Sal","Kétchup","Mayonesa","Mostaza","Empaque","Tenedor"], equiposRequeridos:[idsEquipo["Freidora"]]},
    {nombre:"Pancho / hot dog", categoria:"Salado", ingredientes:["Salchicha para hot dog","Kétchup","Mostaza","Mayonesa","Servilleta","Palito"], equiposRequeridos:[idsEquipo["Plancha"]]},
    {nombre:"Hamburguesa", categoria:"Salado", ingredientes:["Pan","Carne","Queso","Lechuga","Tomate","Papas al hilo","Kétchup","Mostaza","Mayonesa","Envoltura","Cajita"], equiposRequeridos:[idsEquipo["Plancha"]]},
    {nombre:"Mini hamburguesa", categoria:"Salado", ingredientes:["Pan","Carne","Queso","Lechuga","Tomate","Papas al hilo","Kétchup","Mostaza","Mayonesa","Envoltura","Cajita"], equiposRequeridos:[idsEquipo["Plancha"]]},
    {nombre:"Churros", categoria:"Dulce", ingredientes:["Churros (comprados)","Servilletas"], equiposRequeridos:[idsEquipo["Vitrina / exhibidor de churros"]]},
    {nombre:"Helados", categoria:"Dulce", ingredientes:[], equiposRequeridos:[idsEquipo["Carrito de helados (con baterías)"]]},
    {nombre:"Manzanas acarameladas", categoria:"Dulce", ingredientes:["Manzanas acarameladas (compradas)"], equiposRequeridos:[]},
    {nombre:"Chicha morada", categoria:"Bebida", ingredientes:["Maíz morado","Canela","Piña","Azúcar (por si acaso)","Esencia/concentrado/pulpa de chicha morada","Vasos con tapa y sorbete, o botellas"], equiposRequeridos:[idsEquipo["Dispensador de chicha morada"]]},
    {nombre:"Algodón de azúcar", categoria:"Dulce", ingredientes:["Azúcar","Colorante","Palitos"], equiposRequeridos:[idsEquipo["Máquina de algodón de azúcar"]]},
  ];
  const batchP = db.batch();
  productos.forEach(p=>{ const ref = db.collection('todolist_productos').doc(); batchP.set(ref,p); });
  await batchP.commit();

  // ---- General: solo aplica si hay snacks en el evento (condicion), salvo la extensión que también aplica con inflables ----
  const general = [
    {texto:"Guantes", grupo:"Uniforme/personal", condicion:"snack"},
    {texto:"Gorro", grupo:"Uniforme/personal", condicion:"snack"},
    {texto:"Tapabocas", grupo:"Uniforme/personal", condicion:"snack"},
    {texto:"Mandil", grupo:"Uniforme/personal", condicion:"snack"},
    {texto:"Barra de snacks / mesa bar con sombrilla", grupo:"Insumos generales", condicion:"snack"},
    {texto:"Servilletas extra", grupo:"Insumos generales", condicion:"snack"},
    {texto:"Bolsas de basura", grupo:"Insumos generales", condicion:"snack"},
    {texto:"Extensión eléctrica", grupo:"Insumos generales", condicion:"snack_o_inflable"},
  ];
  const batchG = db.batch();
  general.forEach(g=>{ const ref = db.collection('todolist_general').doc(); batchG.set(ref,g); });
  await batchG.commit();

  await metaRef.set({version:CATALOGO_VERSION});
}

/* ---------- Listeners en tiempo real ---------- */
function initListeners(){
  const onErr = (nombre) => (err) => {
    console.error(`Error leyendo ${nombre}:`, err);
    DIAG.errores[nombre] = err.code||err.message||'error';
    toast(`⚠️ No se pudo leer ${nombre} (${err.code||err.message||'error'})`);
  };
  db.collection('todolist_productos').orderBy('nombre').onSnapshot(s=>{
    PRODUCTOS = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='productos') renderCatalogo();
    if(document.getElementById('sheet').dataset.type==='evento') renderEventoFormChips();
    scheduleSync();
  }, onErr('productos'));
  db.collection('todolist_equipos').orderBy('nombre').onSnapshot(s=>{
    EQUIPOS = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='equipos') renderCatalogo();
    if(document.getElementById('sheet').dataset.type==='evento') renderEventoFormChips();
    scheduleSync();
  }, onErr('equipos'));
  db.collection('todolist_general').onSnapshot(s=>{
    GENERAL = s.docs.map(d=>({id:d.id,...d.data()}));
    if(currentMainView==='catalogo' && currentCatTab==='alistgen') renderCatalogo();
    scheduleSync();
  }, onErr('items generales'));
  db.collection('todolist_eventos').onSnapshot(s=>{
    EVENTOS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    if(currentMainView==='eventos') renderEventos();
    if(currentMainView==='detalle' && currentEventoId) renderDetalle();
  }, onErr('eventos'));
  db.collection('todolist_reparaciones').onSnapshot(s=>{
    REPARACIONES = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
    if(currentMainView==='reparaciones') renderReparaciones();
  }, onErr('reparaciones'));

  // ---- Solo lectura: catálogo y reservas reales de CHISPEKAS ----
  db.collection('products').onSnapshot(s=>{
    CK_PRODUCTS = s.docs.map(d=>({id:d.id,...d.data()}));
    scheduleSync();
  }, err=>{ console.warn('No se pudo leer products de CHISPEKAS', err); DIAG.errores['products (CHISPEKAS)']=err.code||err.message; });
  db.collection('reservations').onSnapshot(s=>{
    CK_RESERVATIONS = s.docs.map(d=>({id:d.id,...d.data()}));
    scheduleSync();
  }, err=>{ console.warn('No se pudo leer reservations de CHISPEKAS', err); DIAG.errores['reservations (CHISPEKAS)']=err.code||err.message; });
}

/* ---------- Sincronización automática con reservas de CHISPEKAS ---------- */
const INSPECCION_GENERICA = {
  inflable:            ["Motor/soplador funciona","Limpio, sin manchas","Sin roturas, bien cosido"],
  saltarines:          ["Malla de seguridad","Resortes en buen estado","Fierros completos","Sin roturas, bien cosido"],
  juegos_infantiles:   ["Limpio"],
  mobiliario:          ["Limpio"],
};

function inspeccionParaEquipoIds(equipoIds){
  const out=[];
  [...new Set(equipoIds.filter(Boolean))].forEach(eqId=>{
    const eq = EQUIPOS.find(e=>e.id===eqId); if(!eq) return;
    (eq.items||[]).forEach(it=> out.push({key:`equipo::${eqId}::${it}`, equipo:eq.nombre, texto:it, estado:null}));
  });
  return out;
}
function condicionAplica(condicion, hasSnack, hasInflable){
  if(condicion==='snack') return hasSnack;
  if(condicion==='snack_o_inflable') return hasSnack||hasInflable;
  return true;
}

function computeDesiredCompras(prodIds){
  const out=[];
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    const linked = PRODUCTOS.find(p=>p.chispekasId===pid);
    if(linked){
      (linked.ingredientes||[]).forEach(ing=> out.push({id:uid(), key:`${pid}::${ing}`, texto:ing, checked:false}));
    } else if(ck.category==='snack'){
      out.push({id:uid(), key:`${pid}::insumos`, texto:`Preparar insumos: ${ck.name||'producto'}`, checked:false});
    }
  });
  return out;
}
function computeDesiredInspeccion(prodIds){
  const out=[];
  const equipoIdsDeProductos=[];
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    const linkedEquipo = EQUIPOS.find(e=>e.chispekasId===pid);
    const linkedProducto = PRODUCTOS.find(p=>p.chispekasId===pid);
    if(linkedEquipo){
      (linkedEquipo.items||[]).forEach(it=> out.push({id:uid(), key:`${pid}::${it}`, equipo:ck.name||'Producto', texto:it, estado:null}));
    } else if(INSPECCION_GENERICA[ck.category]){
      INSPECCION_GENERICA[ck.category].forEach(it=> out.push({id:uid(), key:`${pid}::${it}`, equipo:ck.name||'Producto', texto:it, estado:null}));
    }
    if(linkedProducto) equipoIdsDeProductos.push(...(linkedProducto.equiposRequeridos||[]));
  });
  out.push(...inspeccionParaEquipoIds(equipoIdsDeProductos));
  return out;
}
function categoriasPresentesCk(prodIds){
  let hasSnack=false, hasInflable=false;
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    if(ck.category==='snack') hasSnack=true;
    if(ck.category==='inflable') hasInflable=true;
    if(PRODUCTOS.find(p=>p.chispekasId===pid)) hasSnack=true;
  });
  return {hasSnack, hasInflable};
}
function computeDesiredAlistamiento(prodIds){
  const out=[];
  const {hasSnack, hasInflable} = categoriasPresentesCk(prodIds);
  GENERAL.forEach(g=>{ if(condicionAplica(g.condicion,hasSnack,hasInflable)) out.push({id:uid(), key:`general::${g.id}`, texto:g.texto, grupo:g.grupo, checked:false}); });
  prodIds.forEach(pid=>{
    const ck = CK_PRODUCTS.find(p=>p.id===pid); if(!ck) return;
    out.push({id:uid(), key:`${pid}::cargar`, texto:`Cargar: ${ck.name||'producto'}`, grupo:'Productos del evento', checked:false});
  });
  return out;
}
function claveEstable(arr){
  // Serializa de forma estable (mismo orden de propiedades siempre) para poder comparar
  // "¿cambió de verdad?" sin falsos positivos por orden de llaves del objeto.
  return JSON.stringify((arr||[]).map(i=>({
    key:i.key||'', texto:i.texto||'', grupo:i.grupo||'', equipo:i.equipo||'',
    checked: !!i.checked, estado: i.estado||null
  })));
}
function limpiarUndefined(obj){
  const out={};
  Object.keys(obj).forEach(k=>{ if(obj[k]!==undefined) out[k]=obj[k]; });
  return out;
}
function mergeItems(existing, desired){
  const exByKey = new Map((existing||[]).filter(i=>i.key).map(i=>[i.key,i]));
  const manual = (existing||[]).filter(i=> !i.key || i.key.startsWith('manual::'));
  const merged = desired.map(d=>{
    const ex = exByKey.get(d.key);
    if(!ex) return limpiarUndefined(d);
    const out = {...d}; // toma texto/grupo/equipo/key actualizados del catálogo
    if(Object.prototype.hasOwnProperty.call(ex,'checked')) out.checked = ex.checked; // conserva lo ya marcado
    if(Object.prototype.hasOwnProperty.call(ex,'estado')) out.estado = ex.estado;
    if(ex.id) out.id = ex.id;
    return limpiarUndefined(out);
  });
  return [...merged, ...manual].map(limpiarUndefined);
}
function nombreReserva(r){ return `${r.event||'Evento'}${r.client? ' - '+r.client:''}`.trim(); }

async function syncReservasConfirmadas(){
  if(!CK_RESERVATIONS.length || !CK_PRODUCTS.length) return;
  const confirmadas = CK_RESERVATIONS.filter(r=>r.status==='confirmado');
  let fallidas = 0;
  for(const r of confirmadas){
    try{
      const prodIds = Array.isArray(r.products) ? r.products : [];
      const existing = EVENTOS.find(e=>e.origenReservaId===r.id);
      const desiredCompras = computeDesiredCompras(prodIds);
      const desiredInspeccion = computeDesiredInspeccion(prodIds);
      const desiredAlistamiento = computeDesiredAlistamiento(prodIds);
      const nombre = nombreReserva(r);
      const reservaEstado = r.status || 'confirmado';
      const fecha = (typeof r.date==='string') ? r.date : '';
      if(!existing){
        await db.collection('todolist_eventos').add({
          nombre, fecha, negocio:'CHISPEKAS', estado:'pendiente',
          origenReservaId:r.id, reservaEstado,
          productos:[], equipos:[],
          compras:desiredCompras, inspeccion:desiredInspeccion, alistamiento:desiredAlistamiento
        });
      } else {
        const compras = mergeItems(existing.compras, desiredCompras);
        const inspeccion = mergeItems(existing.inspeccion, desiredInspeccion);
        const alistamiento = mergeItems(existing.alistamiento, desiredAlistamiento);
        const changed = claveEstable(compras)!==claveEstable(existing.compras)
          || claveEstable(inspeccion)!==claveEstable(existing.inspeccion)
          || claveEstable(alistamiento)!==claveEstable(existing.alistamiento)
          || existing.reservaEstado!==reservaEstado || existing.fecha!==fecha || existing.nombre!==nombre;
        if(changed){
          await db.collection('todolist_eventos').doc(existing.id).update({compras, inspeccion, alistamiento, reservaEstado, fecha:fecha||existing.fecha||'', nombre});
        }
      }
      delete DIAG.errores[`reserva ${r.id}`];
    }catch(err){
      fallidas++;
      console.error('No se pudo sincronizar la reserva', r.id, r.client, r.date, err);
      DIAG.errores[`reserva ${r.id} (${r.client||'?'} ${r.date||'?'})`] = err.message||String(err);
    }
  }
  if(fallidas>0) toast(`⚠️ ${fallidas} reserva(s) no se pudieron sincronizar — ver 🔍 Diagnóstico`);
  // Reservas que dejaron de estar confirmadas: no se borra nada, solo se marca
  EVENTOS.filter(e=>e.origenReservaId).forEach(async e=>{
    const r = CK_RESERVATIONS.find(x=>x.id===e.origenReservaId);
    const nuevoEstado = r? r.status : 'eliminada';
    if(nuevoEstado!==e.reservaEstado){
      await db.collection('todolist_eventos').doc(e.id).update({reservaEstado:nuevoEstado});
    }
  });
}

/* ---------- Progreso ---------- */
function progresoEvento(ev){
  const all = [...(ev.compras||[]), ...(ev.alistamiento||[])];
  const insp = (ev.inspeccion||[]);
  const totalChecks = all.length + insp.length;
  const doneChecks = all.filter(i=>i.checked).length + insp.filter(i=>i.estado).length;
  if(totalChecks===0) return 0;
  return Math.round((doneChecks/totalChecks)*100);
}

function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- RENDER: Eventos ---------- */
function renderEventos(){
  const wrap = document.getElementById('eventosList');
  const hoy = hoyISO();
  let list = [...EVENTOS];
  if(eventFilter==='proximos') list = list.filter(e=>e.fecha>=hoy);
  if(eventFilter==='pend') list = list.filter(e=>e.fecha>=hoy && progresoEvento(e)<100);
  if(eventFilter==='listo') list = list.filter(e=>e.fecha>=hoy && progresoEvento(e)===100);
  // eventFilter==='todos' → sin filtro, se ven pasados y futuros
  if(list.length===0){
    const hint = EVENTOS.length>0
      ? `<p>Tienes ${EVENTOS.length} evento(s) guardado(s) en total, pero ninguno calza con este filtro. Prueba tocar "Todos" — si son de fechas viejas (ej. reservas de prueba), ahí los vas a ver.</p>`
      : `<p>Crea un evento y se generan solos los checklists de compras, inspección y alistamiento.</p>`;
    wrap.innerHTML = `<div class="emptystate"><div class="big">🗓️</div><h3>Sin eventos aquí</h3>${hint}</div>`;
    return;
  }
  wrap.innerHTML = list.map(ev=>{
    const p = progresoEvento(ev);
    let badge = p===100 ? `<span class="badge ok">Listo</span>` : `<span class="badge pend">${p}%</span>`;
    if(ev.fecha && ev.fecha < hoy) badge = `<span class="badge" style="background:var(--line); color:var(--ink3)">Pasado</span>`;
    if(ev.origenReservaId && ev.reservaEstado && ev.reservaEstado!=='confirmado'){
      badge = `<span class="badge warn">⚠️ Reserva: ${esc(ev.reservaEstado)}</span>`;
    }
    const link = ev.origenReservaId? `<span title="Sincronizado con CHISPEKAS">🔗</span> `:'';
    return `<div class="card tap" onclick="goDetalle('${ev.id}')">
      <div class="rowtop">
        <div><div class="evname">${link}${esc(ev.nombre)}</div><div class="evmeta">${fmtFecha(ev.fecha)}${ev.negocio? ' · '+esc(ev.negocio):''}</div></div>
        ${badge}
      </div>
      <div class="progwrap"><div class="progbar" style="width:${p}%"></div></div>
    </div>`;
  }).join('');
}

function fmtFecha(f){
  if(!f) return '';
  const [y,m,d] = f.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[parseInt(m)-1]} ${y}`;
}
function esc(s){ return (s||'').toString().replace(/</g,'&lt;'); }

function toggleChip(setKey, id, el){

  if(!sheet[setKey]) sheet[setKey]=new Set();
  const set = sheet[setKey];

async function guardarEvento(){
  const nombre = document.getElementById('fNombre').value.trim();
  const fecha = document.getElementById('fFecha').value;
  const negocio = document.getElementById('fNegocio').value;
  if(!nombre || !fecha){ toast('Falta nombre o fecha'); return; }
  const sheet = document.getElementById('sheet');
  const prodIds = [...(sheet._selProd||[])];
  const equipIds = [...(sheet._selEquip||[])];

  // Generar Compras: ingredientes de cada producto seleccionado
  const compras=[];
  prodIds.forEach(pid=>{
    const p = PRODUCTOS.find(x=>x.id===pid);
    if(p) (p.ingredientes||[]).forEach(ing=> compras.push({id:uid(), key:`${pid}::${ing}`, texto:ing, checked:false}));
  });

  // Generar Inspección: equipos elegidos directamente + máquinas que requiere cada producto elegido
  const inspeccion = [];
  equipIds.forEach(eid=>{
    const e = EQUIPOS.find(x=>x.id===eid);
    if(e) (e.items||[]).forEach(it=> inspeccion.push({id:uid(), key:`${eid}::${it}`, equipo:e.nombre, texto:it, estado:null}));
  });
  const equipoIdsDeProductos = [];
  prodIds.forEach(pid=>{ const p=PRODUCTOS.find(x=>x.id===pid); if(p) equipoIdsDeProductos.push(...(p.equiposRequeridos||[])); });
  [...new Set(equipoIdsDeProductos.filter(Boolean))].forEach(eid=>{
    if(equipIds.includes(eid)) return; // ya se agregó arriba
    const e = EQUIPOS.find(x=>x.id===eid);
    if(e) (e.items||[]).forEach(it=> inspeccion.push({id:uid(), key:`${eid}::${it}`, equipo:e.nombre, texto:it, estado:null}));
  });

  // Generar Alistamiento: general (según condición) + productos + equipos como "cargar"
  const hasSnack = prodIds.length>0;
  const hasInflable = equipIds.some(eid=>{ const e=EQUIPOS.find(x=>x.id===eid); return e && (e.tipo==='Inflable'||e.tipo==='Saltarín'); });
  const alistamiento = [];
  GENERAL.forEach(g=>{ if(condicionAplica(g.condicion,hasSnack,hasInflable)) alistamiento.push({id:uid(), key:`general::${g.id}`, texto:g.texto, grupo:g.grupo, checked:false}); });
  prodIds.forEach(pid=>{ const p=PRODUCTOS.find(x=>x.id===pid); if(p) alistamiento.push({id:uid(), key:`${pid}::cargar`, texto:`Cargar insumos: ${p.nombre}`, grupo:'Productos', checked:false}); });
  equipIds.forEach(eid=>{ const e=EQUIPOS.find(x=>x.id===eid); if(e) alistamiento.push({id:uid(), key:`${eid}::cargar`, texto:`Cargar: ${e.nombre}`, grupo:'Equipos', checked:false}); });

  await db.collection('todolist_eventos').add({
    nombre, fecha, negocio, estado:'pendiente', origenReservaId:null,
    productos:prodIds, equipos:equipIds,
    compras, inspeccion, alistamiento
  });
  closeSheet();
  toast('Evento creado');
}

function renderInspeccionHTML(ev){
  const items = ev.inspeccion||[];
  if(items.length===0) return `<div class="emptystate"><div class="big">🔧</div><p>Sin equipos por inspeccionar. Agrega equipos al evento.</p></div>`;
  const grupos = {};

  let html='';

      const sym = it.estado==='ok'?'✓':it.estado==='malo'?'✕':'';
      return `
      <div class="checkitem">
        <div class="check ${cls}" onclick="cycleInspeccion('${ev.id}','${it.id}')">${sym}</div>
        <div class="checklabel">${esc(it.texto)}</div>
      </div>`;}).join('');
    html += `</div>`;
  });
  return html;
}

function renderAlistamientoHTML(ev){
  const items = ev.alistamiento||[];
  if(items.length===0) return `<div class="emptystate"><div class="big">📋</div><p>Nada que alistar todavía.</p></div>`;
  const grupos = {};
  items.forEach(it=>{ const g=it.grupo||'Otros'; (grupos[g]=grupos[g]||[]).push(it); });
  let html='';
  Object.keys(grupos).forEach(g=>{
    html += `<div class="grouphead">${esc(g)}</div><div class="card">`;
    html += grupos[g].map(it=>`
      <div class="checkitem">
        <div class="check ${it.checked?'on':''}" onclick="toggleAlist('${ev.id}','${it.id}')">${it.checked?'✓':''}</div>
        <div class="checklabel ${it.checked?'on':''}" onclick="toggleAlist('${ev.id}','${it.id}')">${esc(it.texto)}</div>
        <button class="smallx" onclick="eliminarItemEvento('${ev.id}','alistamiento','${it.id}')">✕</button>
      </div>`).join('');
    html += `</div>`;
  });
  html += `<div class="addrow"><input type="text" id="addAlist" placeholder="Agregar pendiente..."><button onclick="addItemEvento('${ev.id}','alistamiento')">+</button></div>`;
  return html;
}

async function toggleCompra(evId, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const compras = (ev.compras||[]).map(i=> i.id===itemId? {...i, checked:!i.checked}: i);
  await db.collection('todolist_eventos').doc(evId).update({compras});
}
async function toggleAlist(evId, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const alistamiento = (ev.alistamiento||[]).map(i=> i.id===itemId? {...i, checked:!i.checked}: i);
  await db.collection('todolist_eventos').doc(evId).update({alistamiento});
}
async function cycleInspeccion(evId, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  let itemRef=null;
  const inspeccion = (ev.inspeccion||[]).map(i=>{
    if(i.id===itemId){
      const siguiente = (i.estado==null) ? 'ok' : (i.estado==='ok') ? 'malo' : null;
      itemRef = {...i, estado:siguiente}; return itemRef;
    }
    return i;
  });
  await db.collection('todolist_eventos').doc(evId).update({inspeccion});
  if(itemRef && itemRef.estado==='malo'){
    await db.collection('todolist_reparaciones').add({
      equipo:itemRef.equipo, problema:itemRef.texto, eventoNombre:ev.nombre,
      fecha:new Date().toISOString().slice(0,10), resuelto:false
    });
    toast('Se agregó a Reparaciones');
  }
}
async function addItemEvento(evId, campo){
  const inputId = campo==='compras'?'addCompra':'addAlist';
  const val = document.getElementById(inputId).value.trim();
  if(!val) return;
  const ev = EVENTOS.find(e=>e.id===evId);
  const arr = [...(ev[campo]||[]), {id:uid(), key:`manual::${uid()}`, texto:val, checked:false, grupo: campo==='alistamiento'?'Otros':undefined}];
  await db.collection('todolist_eventos').doc(evId).update({[campo]:arr});
  document.getElementById(inputId).value='';
}
async function eliminarItemEvento(evId, campo, itemId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const arr = (ev[campo]||[]).filter(i=>i.id!==itemId);
  await db.collection('todolist_eventos').doc(evId).update({[campo]:arr});
}

/* ---------- Impresión ---------- */
function bloqueImprimibleCheck(titulo, items, tipo){
  // tipo: 'check' (una sola casilla) o 'inspeccion' (casilla + estado ok/malo ya marcado)
  let html = `<h2>${esc(titulo)}</h2>`;
  if(!items || items.length===0){ html += `<div class="pempty">Nada aquí</div>`; return html; }
  if(tipo==='inspeccion'){
    const grupos={};
    items.forEach(it=>{ (grupos[it.equipo]=grupos[it.equipo]||[]).push(it); });
    Object.keys(grupos).forEach(g=>{
      html += `<div class="pgroup">${esc(g)}</div>`;
      html += grupos[g].map(it=>`<div class="pitem"><div class="pbox">${it.estado==='ok'?'✓':it.estado==='malo'?'✕':''}</div>${esc(it.texto)}</div>`).join('');
    });
  } else {
    const grupos={};
    items.forEach(it=>{ const g=it.grupo||''; (grupos[g]=grupos[g]||[]).push(it); });
    Object.keys(grupos).forEach(g=>{
      if(g) html += `<div class="pgroup">${esc(g)}</div>`;
      html += grupos[g].map(it=>`<div class="pitem"><div class="pbox"></div>${esc(it.texto)}</div>`).join('');
    });
  }
  return html;
}
function imprimirEvento(){
  if(currentMainView!=='detalle' || !currentEventoId){
    toast('Abre un evento primero para imprimir su lista'); return;
  }
  const ev = EVENTOS.find(e=>e.id===currentEventoId);
  if(!ev) return;
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <h1>${esc(ev.nombre)}</h1>
    <div class="pmeta">${fmtFecha(ev.fecha)}${ev.negocio?' · '+esc(ev.negocio):''}</div>
    ${bloqueImprimibleCheck('🛒 Compras', ev.compras, 'check')}
    ${bloqueImprimibleCheck('🔧 Inspección', ev.inspeccion, 'inspeccion')}
    ${bloqueImprimibleCheck('📋 Alistamiento', ev.alistamiento, 'check')}
  `;
  setTimeout(()=> window.print(), 50);
}

/* ---------- Diagnóstico ---------- */
function rangoFechas(arr, campo){
  const fechas = arr.map(x=>x[campo]).filter(Boolean).sort();
  if(fechas.length===0) return 'sin fechas';
  return `${fechas[0]} → ${fechas[fechas.length-1]}`;
}

  const sheet = document.getElementById('sheet');

    : `<div class="ingr" style="color:var(--teal)">Sin errores de lectura</div>`;
  const confirmadas = CK_RESERVATIONS.filter(r=>r.status==='confirmado');
  sheet.innerHTML = `

    <label class="f">Reservas leídas de CHISPEKAS (colección "reservations")</label>

      <div class="ingr">Rango de fechas (todas): ${esc(rangoFechas(CK_RESERVATIONS,'date'))}</div>
      <div class="ingr">Rango de fechas (confirmadas): ${esc(rangoFechas(confirmadas,'date'))}</div>
    </div>
    <label class="f">Productos leídos de CHISPEKAS (colección "products")</label>

    <label class="f">Eventos guardados en el To Do List (colección "todolist_eventos")</label>
    <div class="card">
      <div class="ingr">Total: <b style="color:var(--ink)">${EVENTOS.length}</b></div>
      <div class="ingr">Rango de fechas: ${esc(rangoFechas(EVENTOS,'fecha'))}</div>
      <div class="ingr">Creados desde reserva: ${EVENTOS.filter(e=>e.origenReservaId).length} · Manuales: ${EVENTOS.filter(e=>!e.origenReservaId).length}</div>

  `;
  openSheet();
}
